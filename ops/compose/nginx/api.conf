server {
    listen 80;
    server_name _;

    # Serve public/ as the document root
    root /var/www/html/public;
    index index.php;

    # -------------------------------------------------
    # Main Symfony Front Controller
    # -------------------------------------------------
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # -------------------------------------------------
    # PHP-FPM Handling
    # -------------------------------------------------
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass api-php:9000;

        # Correct param handling (important!)
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        # Prevent path traversal vulnerabilities
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
    }

    # -------------------------------------------------
    # Static Files Cache (CSS, JS, Images, Fonts)
    #
    # IMPORTANT:
    # We EXCLUDE /product-image/ — so Symfony can serve those.
    # -------------------------------------------------
    location ~* ^/(?!product-image/).*\.(?:css|js|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2)$ {
        access_log off;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # -------------------------------------------------
    # Security Headers
    # -------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Block access to hidden files (.env, .git, etc.)
    location ~ /\. {
        deny all;
    }
}
