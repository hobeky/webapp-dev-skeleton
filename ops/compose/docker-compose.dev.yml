services:
  db:
    image: mariadb:11
    profiles: ["dev"]
    environment:
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db-data-dev:/var/lib/mysql
    ports:
      - "3308:3306"

  redis:
    image: redis:7-alpine
    profiles: ["dev"]

  mailhog:
    image: mailhog/mailhog:latest
    profiles: ["dev"]
    ports:
      - "8025:8025"

  api-php:
    build:
      context: ../../
      dockerfile: ops/dockerfiles/api.Dockerfile
    #      target: dev
    profiles: ["dev"]
    environment:
      APP_ENV: dev
      DATABASE_URL: "mysql://app:app@db:3306/app?charset=utf8mb4&serverVersion=mariadb-11.0.0"
      DATABASE_URL_TEST: "mysql://root:root@db:3306/app?charset=utf8mb4&serverVersion=mariadb-11.0.0"
      DEFAULT_URI: "http://localhost"
      APP_MAIL_FROM: "test@example.com"
      APP_MAIL_FROM_NAME: "Test Mailer"
      APP_MAIL_REPLY_TO: "test@example.com"
      APP_MAIL_REPLY_TO_NAME: "Test Reply"
      APP_INVOICE_SUPPLIER_EMAIL: "test@example.com"
    volumes:
      - ../../apps/api:/var/www/html:delegated
    depends_on:
      - db
      - redis

  api-nginx:
    image: nginx:1.27-alpine
    profiles: ["dev"]
    volumes:
      - ../../apps/api:/var/www/html:delegated
      - ./nginx/api.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - api-php

  ui-node:
    build:
      context: ../../
      dockerfile: ops/dockerfiles/frontend.Dockerfile
    user: "${UID}:${GID}"
    profiles: ["dev"]
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ../../apps/frontend:/usr/src/app:delegated
    ports:
      - "4200:3000"
      - "3001:3001"
    depends_on:
      - api-nginx

volumes:
  db-data-dev:
  frontend-node-modules:
